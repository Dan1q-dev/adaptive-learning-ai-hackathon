openapi: 3.1.0
info:
  title: Adaptive Learning AI
  version: 0.1.0
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /api/v1/generate:
    post:
      operationId: generateQuiz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
      responses:
        "200":
          description: Generated quiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateResponse"
        "422":
          description: Invalid request
        "502":
          description: Model/provider failure
  /api/v1/evaluate:
    post:
      operationId: evaluateAnswers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateRequest"
      responses:
        "200":
          description: Evaluation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluateResponse"
        "422":
          description: Invalid request
        "502":
          description: Model/provider failure
components:
  schemas:
    GenerateRequest:
      type: object
      additionalProperties: false
      required: [material]
      properties:
        material:
          type: string
          minLength: 100
        question_count:
          type: integer
          minimum: 3
          maximum: 10
          default: 5
        difficulty:
          type: string
          enum: [auto, easy, medium, hard]
          default: auto
        language:
          type: string
          default: ru
    Option:
      type: object
      additionalProperties: false
      required: [id, text]
      properties:
        id:
          type: string
        text:
          type: string
    Question:
      type: object
      additionalProperties: false
      required: [id, topic, text, options, correct_option_id, explanation]
      properties:
        id:
          type: string
        topic:
          type: string
        text:
          type: string
        options:
          type: array
          minItems: 2
          maxItems: 6
          items:
            $ref: "#/components/schemas/Option"
        correct_option_id:
          type: string
        explanation:
          type: string
    GenerateResponse:
      type: object
      additionalProperties: false
      required: [quiz_id, title, questions]
      properties:
        quiz_id:
          type: string
        title:
          type: string
        questions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Question"
    Answer:
      type: object
      additionalProperties: false
      required: [question_id, option_id]
      properties:
        question_id:
          type: string
        option_id:
          type: string
    EvaluateRequest:
      type: object
      additionalProperties: false
      required: [quiz_id, material, questions, answers]
      properties:
        quiz_id:
          type: string
        material:
          type: string
        questions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Question"
        answers:
          type: array
          items:
            $ref: "#/components/schemas/Answer"
    QuestionFeedback:
      type: object
      additionalProperties: false
      required: [question_id, is_correct, selected_option_id, correct_option_id, explanation, recommendation]
      properties:
        question_id:
          type: string
        is_correct:
          type: boolean
        selected_option_id:
          type: [string, "null"]
        correct_option_id:
          type: string
        explanation:
          type: string
        recommendation:
          type: string
    AdditionalTask:
      type: object
      additionalProperties: false
      required: [topic, task]
      properties:
        topic:
          type: string
        task:
          type: string
    EvaluateResponse:
      type: object
      additionalProperties: false
      required: [quiz_id, score, correct_count, total, level, weak_topics, feedback, additional_tasks]
      properties:
        quiz_id:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 100
        correct_count:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        level:
          type: string
          enum: [beginner, intermediate, advanced]
        weak_topics:
          type: array
          items:
            type: string
        feedback:
          type: array
          items:
            $ref: "#/components/schemas/QuestionFeedback"
        additional_tasks:
          type: array
          items:
            $ref: "#/components/schemas/AdditionalTask"
